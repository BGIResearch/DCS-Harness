name: dsh 兼容性测试

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # 每周一 03:00 UTC 跑一次：dsh 上游发新版时可第一时间发现破坏
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  compat:
    name: dsh 兼容性（${{ matrix.dsh }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 同时测「声明支持的最低版本」与「最新版本」，
        # 前者保证向后兼容，后者提前暴露平台破坏。
        dsh: ['latest']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 关键：装真实 dsh，而不是项目内 devDependency 里的旧版本。
      # 本插件的 peerDependencies 可能滞后，只有装真实版本才能测到运行时行为。
      - name: 安装真实 dsh
        run: |
          npm i -g @deepseek-ai/dsh@${{ matrix.dsh }}
          dsh --version || true

      - name: 探测 dsh 安装根
        run: |
          # 显式指定并校验：DSH_ROOT 无效时测试会以退出码 2 失败，
          # 避免「静默回退到别的 dsh」造成假绿。
          ROOT="$(npm root -g)"
          test -f "$ROOT/@deepseek-ai/dsh/package.json" || { echo "未找到 dsh: $ROOT"; exit 1; }
          echo "DSH_ROOT=$ROOT" >> "$GITHUB_ENV"
          node -e "console.log('dsh', require('$ROOT/@deepseek-ai/dsh/package.json').version)"
          node -e "console.log('dsh-tools', require('$ROOT/@deepseek-ai/dsh-tools/package.json').version)"

      # 退出码语义：0=全通过 / 1=有用例失败 / 2=环境配置错误
      - name: 运行兼容性测试
        run: npm test

      # 失败时也上传报告，便于对比哪一层红了
      - name: 生成 JSON 报告
        if: always()
        run: npm test -- --json > compat-report.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-report
          path: compat-report.json
